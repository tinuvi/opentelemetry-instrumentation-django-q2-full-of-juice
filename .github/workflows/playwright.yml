name: Playwright E2E

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'opentelemetry_instrumentation_django_q2/**'
      - 'sample-project/**'
      - 'playwright/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright tests (chromium + juice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: sample-project/docker-compose.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json

      - name: Bring up sample-project stack (upstream + juice profiles)
        # `--profile juice` adds juice-web + juice-worker on top of the default
        # services. The juice E2E specs (npm run test:juice) need the juice-web
        # service at :8001; the upstream specs continue using :8000.
        run: docker compose -f $COMPOSE_FILE --profile juice up --build --detach --wait --wait-timeout 360

      - name: Wait for sample-project /health/ to be ready
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health/ > /dev/null; then
              echo "sample-project is up"
              exit 0
            fi
            sleep 2
          done
          echo "sample-project failed to come up"
          docker compose -f $COMPOSE_FILE ps
          docker compose -f $COMPOSE_FILE logs --tail 200
          exit 1

      - name: Wait for Jaeger query API
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:16686/api/services > /dev/null; then
              echo "jaeger is up"
              exit 0
            fi
            sleep 2
          done
          echo "jaeger failed to come up"
          docker compose -f $COMPOSE_FILE logs --tail 200 jaeger
          exit 1

      - name: Wait for OTel collector Prometheus endpoint
        run: |
          # metrics.spec.ts scrapes :8889 for the histogram — fail fast here if
          # the collector never started serving so the failure mode is obvious.
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8889/metrics > /dev/null; then
              echo "otel-collector prometheus endpoint is up"
              exit 0
            fi
            sleep 2
          done
          echo "otel-collector failed to come up"
          docker compose -f $COMPOSE_FILE logs --tail 200 otel-collector
          exit 1

      - name: Install Playwright dependencies
        working-directory: playwright
        run: |
          npm ci --ignore-scripts
          npm run install-browsers -- chromium

      - name: Wait for juice-web /health/ to be ready
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8001/health/ > /dev/null; then
              echo "juice-web is up"
              exit 0
            fi
            sleep 2
          done
          echo "juice-web failed to come up"
          docker compose -f $COMPOSE_FILE --profile juice ps
          docker compose -f $COMPOSE_FILE --profile juice logs --tail 200 juice-web juice-worker
          exit 1

      - name: Run Playwright tests (upstream — chromium project)
        working-directory: playwright
        env:
          CI: 'true'
          SAMPLE_PROJECT_URL: http://localhost:8000
          JAEGER_URL: http://localhost:16686
          COLLECTOR_PROMETHEUS_URL: http://localhost:8889
        run: npm test

      - name: Run Playwright tests (juice fork — juice project)
        working-directory: playwright
        env:
          CI: 'true'
          JUICE_SAMPLE_PROJECT_URL: http://localhost:8001
          JAEGER_URL: http://localhost:16686
        run: npm run test:juice

      - name: Dump compose logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/compose-logs
          docker compose -f $COMPOSE_FILE --profile juice logs --no-color > /tmp/compose-logs/all.log
          docker compose -f $COMPOSE_FILE --profile juice logs --no-color jaeger > /tmp/compose-logs/jaeger.log || true
          docker compose -f $COMPOSE_FILE --profile juice logs --no-color web > /tmp/compose-logs/web.log || true
          docker compose -f $COMPOSE_FILE --profile juice logs --no-color worker > /tmp/compose-logs/worker.log || true
          docker compose -f $COMPOSE_FILE --profile juice logs --no-color juice-web > /tmp/compose-logs/juice-web.log || true
          docker compose -f $COMPOSE_FILE --profile juice logs --no-color juice-worker > /tmp/compose-logs/juice-worker.log || true
          docker compose -f $COMPOSE_FILE --profile juice logs --no-color otel-collector > /tmp/compose-logs/otel-collector.log || true

      - name: Tear down compose stack
        if: always()
        run: docker compose -f $COMPOSE_FILE --profile juice down --volumes --remove-orphans

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report
          retention-days: 14

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs
          retention-days: 14
